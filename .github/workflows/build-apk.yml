name: Build ApexLift APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ApexLift-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ApexLift project
        run: |
          unzip ApexLift-Android-Project.zip -d extracted

      - name: Build APK
        working-directory: extracted/ApexLift-Android
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexLift-APK
          path: extracted/ApexLift-Android/app/build/outputs/apk/debug/app-debug.apk
